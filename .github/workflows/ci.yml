name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node runs Vitest and the tools behind `bun install`'s postinstall
      # patch. Bun installs the packages and runs the app.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The page must build before the gate exercises the app.
      - name: Build
        run: bun run build

      # No credential is needed: the starter runs TypeScript on Bun and has no
      # deploy step. `check` covers types, lint, format, and tests.
      - name: Check
        run: bun run check

  # The browser suite stays outside `bun run check`: it needs Chromium, and its
  # evidence is measured rather than asserted by the gate.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Accessibility suite
        run: bun run check:a11y
